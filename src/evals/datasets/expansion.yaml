      query: "write a query in SQL to calculate row numbers for all rows between 50 to 60 inclusive. Sort the result set on orderdate."
      ground_truth_sql: |
        WITH OrderedOrders AS  
        (  
            SELECT 
                SalesOrderID, 
                OrderDate,  
                ROW_NUMBER() OVER (ORDER BY OrderDate) AS RowNumber  
