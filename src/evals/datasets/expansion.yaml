      query: "write a query in SQL to sort the BusinessEntityID in descending order for those employees that have the SalariedFlag set to 'true' and in ascending order that have the SalariedFlag set to 'false'. Return BusinessEntityID, and SalariedFlag."
      ground_truth_sql: |
        SELECT 
            BusinessEntityID, 
            SalariedFlag  
        FROM 
            HumanResources.Employee  
        ORDER BY 
            CASE 
                WHEN SalariedFlag = 'true' THEN BusinessEntityID 
            END DESC,  
            CASE 
                WHEN SalariedFlag = 'false' THEN BusinessEntityID 
            END;
      tags: ["ordering", "case_when"]
      difficulty: "easy"

      metadata:
        category: "ordering"
        source: "benchmark_import"
        query_language: "en"

      expected_outcome:
        tools_called: ["schema_retrieve", "run_sql"]
        final_answer_contains: ["BusinessEntityID", "SalariedFlag"]
        max_execution_time_ms: 90000
