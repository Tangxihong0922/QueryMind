    - id: "sql_164"
      database_id: "adventureworks"
      dialect: "postgres"

      user_id: "admin"
      username: "Xihong"
      email: "admin@querymind"
      user_groups: ["admin", "user"]

      query: "write a query in SQL to find the SalesPersonID, salesyear, totalsales, salesquotayear, salesquota, and amt_above_or_below_quota columns. Sort the result set in ascending order on SalesPersonID, and SalesYear columns."
      ground_truth_sql: |
        WITH Sales_CTE AS (
            SELECT 
                SalesPersonID,
                SUM(TotalDue) AS TotalSales,
                EXTRACT(YEAR FROM OrderDate) AS SalesYear
            FROM Sales.SalesOrderHeader
            WHERE SalesPersonID IS NOT NULL
            GROUP BY SalesPersonID, EXTRACT(YEAR FROM OrderDate)
        ),
        Sales_Quota_CTE AS (
            SELECT 
                BusinessEntityID,
                SUM(SalesQuota) AS SalesQuota,
                EXTRACT(YEAR FROM QuotaDate) AS SalesQuotaYear
            FROM Sales.SalesPersonQuotaHistory
            GROUP BY BusinessEntityID, EXTRACT(YEAR FROM QuotaDate)
        )
        SELECT 
            s.SalesPersonID,
            s.SalesYear,
            s.TotalSales,
            q.SalesQuotaYear,
            q.SalesQuota,
            s.TotalSales - q.SalesQuota AS Amt_Above_or_Below_Quota
        FROM Sales_CTE s
        JOIN Sales_Quota_CTE q 
            ON s.SalesPersonID = q.BusinessEntityID 
            AND s.SalesYear = q.SalesQuotaYear
        ORDER BY s.SalesPersonID, s.SalesYear;
      tags: ["cte"]
      difficulty: "hard"

      metadata:
        category: "cte"
        source: "benchmark_import"
        query_language: "en"

      expected_outcome:
        tools_called: ["schema_retrieve", "run_sql"]
        final_answer_contains: ["SalesPersonID", "TotalSales", "YEAR"]
        max_execution_time_ms: 150000
