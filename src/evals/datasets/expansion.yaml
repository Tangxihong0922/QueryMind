      username: "Xihong"
      email: "admin@querymind"
      user_groups: ["admin", "user"]

      query: "write a query in SQL to evaluate whether the values in the MakeFlag and FinishedGoodsFlag columns are the same for products with ProductID less than 10. If the values in MakeFlag and FinishedGoodsFlag are the same, return NULL; otherwise, return the value of MakeFlag. Return the columns ProductID, MakeFlag, FinishedGoodsFlag, and the evaluated result."
      ground_truth_sql: |
        SELECT 
            ProductID, 
            MakeFlag, 
            FinishedGoodsFlag, 
            CASE  
                WHEN MakeFlag = FinishedGoodsFlag THEN NULL  
                ELSE MakeFlag  
            END  
        FROM 
            Production.Product  
        WHERE 
            ProductID < 10;
      tags: ["null_handling"]
      difficulty: "easy"

      metadata:
        category: "null_handling"
        source: "benchmark_import"
        query_language: "en"

      expected_outcome:
        tools_called: ["schema_retrieve", "run_sql"]
        final_answer_contains: ["ProductID", "MakeFlag", "FinishedGoodsFlag", "evaluated result"]
        max_execution_time_ms: 90000
