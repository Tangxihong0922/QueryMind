      dialect: "postgres"

      user_id: "admin"
      username: "Xihong"
      email: "admin@querymind"
      user_groups: ["admin", "user"]

      query: "write a query in SQL to return the highest hourly wage for each job title. Restricts the titles to those that are held by men with a maximum pay rate greater than 40 dollars or women with a maximum pay rate greater than 42 dollars."
      ground_truth_sql: |
        SELECT 
            JobTitle, 
            MAX(ph1.Rate) AS MaximumRate  
        FROM 
            HumanResources.Employee AS e  
            JOIN HumanResources.EmployeePayHistory AS ph1 ON e.BusinessEntityID = ph1.BusinessEntityID  
        GROUP BY 
            JobTitle  
        HAVING 
            (
                MAX(CASE WHEN Gender = 'M' THEN ph1.Rate ELSE NULL END) > 40.00  
                OR 
                MAX(CASE WHEN Gender = 'F' THEN ph1.Rate ELSE NULL END) > 42.00
            )  
        ORDER BY 
            MaximumRate DESC;
      tags: ["topk", "aggregation", "having"]
      difficulty: "hard"

      metadata:
        category: "topk"
        source: "benchmark_import"
        query_language: "en"

      expected_outcome:
        tools_called: ["schema_retrieve", "run_sql"]
        final_answer_contains: ["JobTitle", "MaximumRate"]
        max_execution_time_ms: 150000
