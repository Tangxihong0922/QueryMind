  test_cases:
    - id: "sql_124"
      database_id: "adventureworks"
      dialect: "postgres"

      user_id: "admin"
      username: "Xihong"
      email: "admin@querymind"
      user_groups: ["admin", "user"]

      query: "write a query in SQL to order the result set by the column TerritoryName when the column CountryRegionName is equal to 'United States' and by CountryRegionName for all other rows. Return BusinessEntityID, LastName, TerritoryName, CountryRegionName."
      ground_truth_sql: |
        SELECT 
            BusinessEntityID, 
            LastName, 
            TerritoryName, 
            CountryRegionName  
        FROM 
            Sales.vSalesPerson  
        WHERE 
            TerritoryName IS NOT NULL  
        ORDER BY 
            CASE 
                WHEN CountryRegionName = 'United States' THEN TerritoryName  
                ELSE CountryRegionName 
            END;        
      tags: ["ordering", "case_when"]
      difficulty: "easy"

      metadata:
        category: "ordering"
        source: "benchmark_import"
        query_language: "en"

      expected_outcome:
        tools_called: ["schema_retrieve", "run_sql"]
        final_answer_contains: ["BusinessEntityID", "LastName", "TerritoryName", "CountryRegionName"]
        max_execution_time_ms: 90000
    - id: "sql_126"
