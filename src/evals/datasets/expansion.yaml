      user_groups: ["admin", "user"]

      query: "write a query in SQL to return the count of employees by Name and Title, Name, and company total. Filter the results by department ID 12 or 14. For each row, identify its aggregation level in the Title column."
      ground_truth_sql: |
        SELECT D.Name  -- Selecting the department name.
            ,CASE   
            WHEN GROUPING(D.Name, E.JobTitle) = 0 THEN E.JobTitle  
            WHEN GROUPING(D.Name, E.JobTitle) = 1 THEN CONCAT('Total :', D.Name)  
            WHEN GROUPING(D.Name, E.JobTitle) = 3 THEN 'Company Total:'  
            ELSE 'Unknown'  
            END AS "Job Title"  
            ,COUNT(E.BusinessEntityID) AS "Employee Count" 
        FROM HumanResources.Employee E  
            INNER JOIN HumanResources.EmployeeDepartmentHistory DH  
                ON E.BusinessEntityID = DH.BusinessEntityID  
            INNER JOIN HumanResources.Department D  
                ON D.DepartmentID = DH.DepartmentID       
        WHERE DH.EndDate IS NULL  
            AND D.DepartmentID IN (12,14)  
        GROUP BY ROLLUP(D.Name, E.JobTitle); 
      tags: ["aggregation", "group_by"]
      difficulty: "hard"

      metadata:
        category: "aggregation"
        source: "benchmark_import"
        query_language: "en"

      expected_outcome:
        tools_called: ["schema_retrieve", "run_sql"]
        final_answer_contains: ["name", "Job Title", "Employee Count"]
        max_execution_time_ms: 150000
