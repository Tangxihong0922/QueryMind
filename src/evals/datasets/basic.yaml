      dialect: "postgres"

      user_id: "admin"
      username: "Xihong"
      email: "admin@querymind"
      user_groups: ["admin", "user"]

      query: "Write a query in SQL to calculate the salary percentile for each employee within the 'Information Services' and 'Document Control' departments. The query should return the department, last name, rate, cumulative distribution (CUME_DIST), and percent rank (PERCENT_RANK) of the rate. The result set should be ordered by department in ascending order and rate in descending order. "
      ground_truth_sql: |
        SELECT Department, LastName, Rate,   
              CUME_DIST () OVER (PARTITION BY Department ORDER BY Rate) AS CumeDist,   
              PERCENT_RANK() OVER (PARTITION BY Department ORDER BY Rate) AS PctRank  
        FROM HumanResources.vEmployeeDepartmentHistory AS edh  
            INNER JOIN HumanResources.EmployeePayHistory AS e    
            ON e.BusinessEntityID = edh.BusinessEntityID  
        WHERE Department IN ('Information Services','Document Control')   
        ORDER BY Department, Rate DESC;        

      tags: ["window", "ranking", "comparison", "ordering", "join", "multi_table"]
      difficulty: "hard"

      metadata:
        category: "window"
        source: "manual"
        query_language: "en"

