    - id: "sql_011"
      database_id: "adventureworks"
      dialect: "postgres"

      user_id: "admin"
      username: "Xihong"
      email: "admin@querymind"
      user_groups: ["admin", "user"]

      query: "Write a query in SQL to return the BusinessEntityID, quarter, sales year, and sales quota for the current quarter. Additionally, calculate the differences in sales quota from the first and last quarters of the year for each salesperson. Only include records for years after 2005 and for BusinessEntityIDs between 274 and 275. Order the results by BusinessEntityID, sales year, and quarter."
      ground_truth_sql: |
        SELECT BusinessEntityID,
              DATE_PART('quarter', QuotaDate) AS Quarter,
              date_part('year',QuotaDate) AS SalesYear,
              SalesQuota AS QuotaThisQuarter,
              SalesQuota - FIRST_VALUE(SalesQuota) OVER (
                  PARTITION BY BusinessEntityID, date_part('year',QuotaDate)
                  ORDER BY DATE_PART('quarter', QuotaDate)
              ) AS DifferenceFromFirstQuarter,
              SalesQuota - LAST_VALUE(SalesQuota) OVER (
                  PARTITION BY BusinessEntityID, date_part('year',QuotaDate)
                  ORDER BY DATE_PART('quarter', QuotaDate)
                  RANGE BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING
              ) AS DifferenceFromLastQuarter
        FROM Sales.SalesPersonQuotaHistory
        WHERE date_part('year',QuotaDate) > 2005 AND BusinessEntityID BETWEEN 274 AND 275
        ORDER BY BusinessEntityID, SalesYear, Quarter;        

      tags: ["window", "comparison", "date_filter", "ordering"]
      difficulty: "medium"

      metadata:
        category: "window"
        source: "manual"
        query_language: "en"

      expected_outcome:
        tools_called: ["schema_retrieve", "schema_retrieve", "run_sql"]
        final_answer_contains: ["SELECT", "FROM", "OVER", "PARTITION BY"]
        max_execution_time_ms: 120000

