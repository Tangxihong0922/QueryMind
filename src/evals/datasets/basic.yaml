    - id: "sql_016"
      database_id: "adventureworks"
      dialect: "postgres"

      user_id: "admin"
      username: "Xihong"
      email: "admin@querymind"
      user_groups: ["admin", "user"]

      query: "Write a query in SQL to return the business entity ID, sales year, current sales quota, and the next year's sales quota for a specific salesperson. Use the LEAD window function to get the next year's sales quota, defaulting to 0 if not available. Filter the results for the salesperson with BusinessEntityID 277 for the years 2022 and 2023."
      ground_truth_sql: |
        SELECT 
            BusinessEntityID, 
            date_part('year', QuotaDate) AS SalesYear, 
            SalesQuota AS CurrentQuota,   
            LEAD(SalesQuota, 1, 0) OVER (
                -- Ordering the data by year
                ORDER BY date_part('year', QuotaDate)
            ) AS NextQuota  
        FROM 
            Sales.SalesPersonQuotaHistory  
        WHERE 
            BusinessEntityID = 277 
            AND date_part('year', QuotaDate) IN ('2022', '2023');

      tags: ["window", "comparison", "date_filter", "ordering"]
      difficulty: "hard"

      metadata:
        category: "window"
        source: "manual"
        query_language: "en"

      expected_outcome:
        tools_called: ["schema_retrieve", "schema_retrieve", "run_sql"]
        final_answer_contains: ["SELECT", "FROM", "OVER", "ORDER BY"]
        max_execution_time_ms: 150000

    - id: "sql_017"
