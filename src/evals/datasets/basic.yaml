      query: "Write a SQL query to retrieve the mailing address for any company that is outside the United States (US) and in a city whose name starts with Pa. Return Addressline1, Addressline2, city, postalcode, countryregioncode columns."
      ground_truth_sql: |
        SELECT
          a.AddressLine1,
          a.AddressLine2,
          a.City,
          a.PostalCode,
          s.CountryRegionCode
        FROM Person.Address AS a
        JOIN Person.StateProvince AS s
          ON a.StateProvinceID = s.StateProvinceID
        WHERE s.CountryRegionCode <> 'US'
          AND a.City LIKE 'Pa%';

      tags: ["join", "text_filter", "multi_condition"]
      difficulty: "easy"

