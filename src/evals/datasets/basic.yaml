      query: "Write a query in SQL to find the first and last names of employees who have sold a product with the ProductNumber 'BK-M68B-42'. Return the distinct columns LastName and FirstName."
      ground_truth_sql: |
        SELECT DISTINCT pp.LastName, pp.FirstName 
        FROM Person.Person pp JOIN HumanResources.Employee e
        ON e.BusinessEntityID = pp.BusinessEntityID 
        WHERE pp.BusinessEntityID IN 
        (SELECT SalesPersonID 
        FROM Sales.SalesOrderHeader
        WHERE SalesOrderID IN 
            (SELECT SalesOrderID 
            FROM Sales.SalesOrderDetail
            WHERE ProductID IN 
                (SELECT ProductID 
                FROM Production.Product p 
                WHERE ProductNumber = 'BK-M68B-42')));        

      tags: ["distinct", "subquery", "multi_table", "join"]
      difficulty: "hard"

      metadata:
        category: "subquery"
        source: "manual"
        query_language: "en"

