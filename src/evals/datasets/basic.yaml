    - id: "sql_007"
      database_id: "adventureworks"
      dialect: "postgres"

      user_id: "admin"
      username: "Xihong"
      email: "admin@querymind"
      user_groups: ["admin", "user"]

      query: "write a query in SQL to return the name, list price, and the alias 'LeastExpensive' for the product(s) that have the lowest list price within a given product subcategory (ProductSubcategoryID = 37). Ensure the query filters the results to this specific subcategory and correctly identifies the least expensive product(s)."
      ground_truth_sql: |
        SELECT
          p.Name,
          p.ListPrice,
          p.Name AS LeastExpensive
        FROM Production.Product AS p
        JOIN (
          SELECT MIN(ListPrice) AS MinPrice
          FROM Production.Product
          WHERE ProductSubcategoryID = 37
        ) AS sub
          ON p.ListPrice = sub.MinPrice
        WHERE p.ProductSubcategoryID = 37;

      tags: ["subquery", "aggregation", "filtering"]
      difficulty: "medium"

      metadata:
        category: "subquery"
        source: "manual"
        query_language: "en"

      expected_outcome:
        tools_called: ["schema_retrieve", "schema_retrieve", "run_sql"]
        final_answer_contains: ["SELECT", "FROM", "JOIN", "WHERE"]
        max_execution_time_ms: 120000

    - id: "sql_008"
