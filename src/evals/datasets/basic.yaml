    - id: "sql_003"
      database_id: "adventureworks"
      dialect: "postgres"

      user_id: "admin"
      username: "Xihong"
      email: "admin@querymind"
      user_groups: ["admin", "user"]

      query: "Write a query in SQL to find the sum, average, count, minimum, and maximum order quentity for those orders whose id are 43659 and 43664. Return SalesOrderID, ProductID, OrderQty, sum, average, count, max, and min order quantity."
      ground_truth_sql: |
        SELECT
          SalesOrderID,
          ProductID,
          OrderQty,
          SUM(OrderQty) OVER win AS "Total Quantity",
          AVG(OrderQty) OVER win AS "Avg Quantity",
          COUNT(OrderQty) OVER win AS "No of Orders",
          MIN(OrderQty) OVER win AS "Min Quantity",
          MAX(OrderQty) OVER win AS "Max Quantity"
        FROM Sales.SalesOrderDetail
        WHERE SalesOrderID IN (43659, 43664)
        WINDOW win AS (PARTITION BY SalesOrderID);

      tags: ["window", "aggregation", "filtering"]
      difficulty: "medium"

      metadata:
        category: "window"
        source: "manual"
        query_language: "en"

      expected_outcome:
        tools_called: ["schema_retrieve", "schema_retrieve", "run_sql"]
        final_answer_contains: ["SELECT", "FROM", "OVER", "PARTITION BY"]
        max_execution_time_ms: 120000
    
    - id: "sql_004"
