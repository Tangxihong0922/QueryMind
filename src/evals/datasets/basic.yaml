      query: "Write a query in SQL to obtain a newdate by adding two days with current date for each salespersons. Filter the result set for those salespersons whose sales value is more than zero."
      ground_truth_sql: |
        SELECT 
            p.FirstName, 
            p.LastName,  
            (now() + INTERVAL '2 day') AS "New Date" 
        FROM 
            Sales.SalesPerson AS s   
            INNER JOIN Person.Person AS p   
                ON s.BusinessEntityID = p.BusinessEntityID  
            INNER JOIN Person.Address AS a   
                ON a.AddressID = p.BusinessEntityID  
        WHERE 
            TerritoryID IS NOT NULL   
            AND SalesYTD <> 0;        

      tags: ["date_filter", "numeric_filter", "join", "multi_table"]
      difficulty: "easy"

      metadata:
        category: "date_filter"
        source: "manual"
        query_language: "en"

