      query: "Write a query in SQL to return the department, last name, rate, hire date, and the last hire date within each department partitioned by rate. The query should retrieve data for specific departments ('Information Services' and 'Document Control')."
      ground_truth_sql: |
        SELECT Department
            , LastName
            , Rate
            , HireDate
            , LAST_VALUE(HireDate) OVER (
                PARTITION BY Department ORDER BY Rate
                ) AS LastValue
        FROM HumanResources.vEmployeeDepartmentHistory AS edh
        INNER JOIN HumanResources.EmployeePayHistory AS eph
            ON eph.BusinessEntityID = edh.BusinessEntityID
        INNER JOIN HumanResources.Employee AS e
            ON e.BusinessEntityID = edh.BusinessEntityID
        WHERE Department IN ('Information Services', 'Document Control');

      tags: ["window", "join", "ordering", "multi_table"]
      difficulty: "medium"

      metadata:
        category: "window"
        source: "manual"
        query_language: "en"

