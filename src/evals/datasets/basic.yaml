    - id: "sql_014"
      database_id: "adventureworks"
      dialect: "postgres"

      user_id: "admin"
      username: "Xihong"
      email: "admin@querymind"
      user_groups: ["admin", "user"]

      query: "Write a query in SQL to rank the products in inventory with locationID values between 3 and 4 according to their quantities. The result set is partitioned by LocationID and logically ordered by Quantity. Return productid, name, locationid, quantity, and rank."
      ground_truth_sql: |
        SELECT 
            i.ProductID, 
            p.Name, 
            i.LocationID, 
            i.Quantity,  
        RANK() OVER (
                PARTITION BY i.LocationID
                ORDER BY i.Quantity DESC
            ) AS Rank  
        FROM 
            Production.ProductInventory AS i   
            INNER JOIN Production.Product AS p   
                ON i.ProductID = p.ProductID  
        WHERE 
            i.LocationID BETWEEN 3 AND 4  
        ORDER BY 
            i.LocationID,
            i.Quantity DESC;        

      tags: ["ranking", "window", "ordering", "join", "multi_table", "numeric_filter"]
      difficulty: "medium"

      metadata:
        category: "ranking"
        source: "manual"
        query_language: "en"

      expected_outcome:
