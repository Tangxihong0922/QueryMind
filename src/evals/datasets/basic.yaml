      dialect: "postgres"

      user_id: "admin"
      username: "Xihong"
      email: "admin@querymind"
      user_groups: ["admin", "user"]

      query: "Write a query in SQL to return only rows with a count of employees by department. Filter the results by department ID 8 or 10. Return name, jobtitle, grouping level and employee count."
      ground_truth_sql: |
        SELECT D.Name  
            ,E.JobTitle  
            ,GROUPING(D.Name, E.JobTitle) AS "Grouping Level"  
            ,COUNT(E.BusinessEntityID) AS "Employee Count"  
        FROM HumanResources.Employee AS E  
        INNER JOIN HumanResources.EmployeeDepartmentHistory AS DH  
            ON E.BusinessEntityID = DH.BusinessEntityID  
        INNER JOIN HumanResources.Department AS D  
            ON D.DepartmentID = DH.DepartmentID       
        WHERE DH.EndDate IS NULL  
            AND D.DepartmentID IN (8, 10)  
        GROUP BY ROLLUP(D.Name, E.JobTitle)
        HAVING GROUPING(D.Name, E.JobTitle) = 2;        

      tags: ["aggregation", "group_by", "having", "join", "multi_table"]
      difficulty: "hard"

      metadata:
        category: "aggregation"
        source: "manual"
        query_language: "en"

      expected_outcome:
        tools_called: ["schema_retrieve", "schema_retrieve", "schema_retrieve", "run_sql"]
        final_answer_contains: ["SELECT", "FROM", "GROUP BY", "HAVING"]
        max_execution_time_ms: 150000

