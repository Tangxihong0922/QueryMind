      query: "Write a query in SQL to divide rows into four groups of employees based on their year-to-date sales. Return first name, last name, group as quartile, year-to-date sales, and postal code. "
      ground_truth_sql: |
        SELECT 
            p.FirstName, 
            p.LastName,  
            NTILE(4) OVER(ORDER BY SalesYTD DESC) AS Quartile,  
            CAST(SalesYTD as VARCHAR(20)) AS SalesYTD,  
            a.PostalCode  
        FROM 
            Sales.SalesPerson AS s   
            INNER JOIN Person.Person AS p   
                ON s.BusinessEntityID = p.BusinessEntityID  
            INNER JOIN Person.Address AS a   
                ON a.AddressID = p.BusinessEntityID  
        WHERE 
            TerritoryID IS NOT NULL   
            AND SalesYTD <> 0;        

      tags: ["ranking", "window", "ordering", "join", "multi_table", "numeric_filter", "null_handling"]
      difficulty: "medium"

      metadata:
        category: "ranking"
        source: "manual"
        query_language: "en"

