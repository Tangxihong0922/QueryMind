      dialect: "postgres"

      user_id: "admin"
      username: "Xihong"
      email: "admin@querymind"
      user_groups: ["admin", "user"]

      query: "Write a query in SQL to return only the rows for product that have a sellstartdate that is not NULL and a productline of 'T'. Return productid, productnumber, and name. Arranged the output in ascending order on name."
      ground_truth_sql: |
        SELECT productid, productnumber, name as producName
        FROM production.product
        WHERE sellstartdate IS NOT NULL
        AND production.product.productline= 'T'
        ORDER BY name;

      tags: ["filtering", "null_handling", "ordering"]
      difficulty: "easy"

      metadata:
        category: "filtering"
        source: "manual"
        query_language: "en"

      expected_outcome:
        tools_called: ["schema_retrieve", "run_sql"]
        final_answer_contains: ["SELECT", "FROM", "WHERE", "ORDER BY"]
        max_execution_time_ms: 90000

