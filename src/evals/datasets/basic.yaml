      query: "Write a query in SQL to return the employee with the fewest number of vacation hours compared to other employees with the same job title. Partitions the employees by job title and apply the first value to each partition independently. "
      ground_truth_sql: |
        SELECT
          e.JobTitle,
          p.LastName,
          e.VacationHours,
          FIRST_VALUE(p.LastName) OVER (
            PARTITION BY e.JobTitle
            ORDER BY e.VacationHours ASC
            ROWS UNBOUNDED PRECEDING
          ) AS FewestVacationHours
        FROM HumanResources.Employee AS e
        INNER JOIN Person.Person AS p
          ON e.BusinessEntityID = p.BusinessEntityID
        ORDER BY e.JobTitle;

      tags: ["window", "ranking", "join", "ordering"]
      difficulty: "medium"

      metadata:
        category: "window"
        source: "manual"
        query_language: "en"

      expected_outcome:
        tools_called: ["schema_retrieve", "schema_retrieve", "run_sql"]
        final_answer_contains: ["SELECT", "FROM", "OVER", "PARTITION BY"]
        max_execution_time_ms: 120000

    - id: "sql_009"
